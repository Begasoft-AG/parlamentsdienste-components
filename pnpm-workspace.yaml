packages:
    - 'apps/*'
    - 'libs/*'
    - 'packages/*'
    - 'docs'
catalogs:
    angular22:
        '@angular/build': ~22.0.6
        '@angular/cli': ~22.0.6
        '@angular/common': ~22.0.6
        '@angular/compiler': ~22.0.6
        '@angular/compiler-cli': ~22.0.6
        '@angular/core': ~22.0.6
        '@angular/forms': ~22.0.6
        '@angular/platform-browser': ~22.0.6
        '@schematics/angular': ~22.0.6
        angular-eslint: ^22.1.0
        ng-packagr: ~22.0.1
        rxjs: ~7.8.0
        typescript: ~6.0.3
        zone.js: ~0.15.0
allowBuilds:
    '@parcel/watcher': true
    '@swc/core': true
    esbuild: true
    lmdb: true
    msgpackr-extract: true
    puppeteer: true
linkWorkspacePackages: true
minimumReleaseAgeExclude:
    - '@stencil/react-output-target@1.6.1'
    - '@stencil/vue-output-target@0.14.1'
